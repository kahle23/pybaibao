[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baibao"
version = "0.0.11"
description = "百宝，方便好用的 Python 常用功能库。把日常开发中反复用到的能力封装成简洁的 API，开箱即用。"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    {name = "Kahle"}
]
dependencies = [
    "pykunlun>=0.0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
all = ["easyocr>=1.7.0", "paddleocr>=2.7.0", "opencv-python>=4.8.0", "numpy>=1.24.0", "bottle>=0.12"]
# openpyxl/beautifulsoup4：tests/render/convert/test_html2xlsx.py 在收集期直接
# import openpyxl 读回产物校验，转换路径另需 bs4（源码侧为 modutil 懒加载），
# 不预装则整份测试在收集阶段即 ImportError 中断
# numpy/opencv-python/jinja2/bottle：类型检查走真包路线（numpy/jinja2/opencv 自带
# py.typed，装上即得完整类型；bottle 无类型标注，装上只为消缺包报错，Unknown
# 靠源码内边界收口 cast），版本下界与 all/easyocr/paddleocr extras 保持一致
dev = ["pytest", "ruff", "mypy", "openpyxl", "beautifulsoup4", "numpy>=1.24.0", "opencv-python>=4.8.0", "jinja2", "bottle>=0.12"]
easyocr = ["easyocr>=1.7.0", "opencv-python>=4.8.0", "numpy>=1.24.0"]
paddleocr = ["paddleocr>=2.7.0", "opencv-python>=4.8.0", "numpy>=1.24.0"]
autotest = ["playwright>=1.40", "python-dotenv>=1.0", "faker", "requests>=2.28"]
# 阿里云 OSS 实现的官方 SDK。不装此 extra 时 import baibao.oss 仍正常，
# 仅在 AliyunOssClient 实际发起操作时经 modutil 自动安装。
oss = ["oss2>=2.18.0"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true

# oss2 经 modutil 延迟导入（AliyunOssClient.get_driver），未安装时不应被判错；
# numpy/cv2/jinja2 已进 dev extra 走真包检查（装上后 mypy 自动改用真实类型），
# 此处豁免是未装 dev extra 环境的兜底；easyocr/paddleocr/bottle 属重型/无类型
# 可选依赖，按实际 import 的模块名豁免
[[tool.mypy.overrides]]
module = ["easyocr", "paddleocr", "bottle", "playwright", "playwright.sync_api", "dotenv", "faker", "oss2", "requests", "numpy", "cv2", "jinja2"]
ignore_missing_imports = true

# bottle 无类型标注，其路由装饰器（@app.get/@app.post/@app.error）会把
# 被装饰的处理函数整体降级为 untyped（untyped-decorator），属第三方库噪声
[[tool.mypy.overrides]]
module = "baibao.ai.ocr.server"
disable_error_code = ["untyped-decorator"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "S110",    # try-except-pass：资源清理场景，静默是预期行为
    "BLE001",  # 盲异常：与 S110 重叠的工具库资源清理场景
    "DTZ005",  # datetime.now() 无 tz：工具库默认使用 naive datetime
    "DTZ006",  # fromtimestamp() 无 tz：同上（naive datetime 为全项目约定）
    "DTZ007",  # strptime 无 %z：同上
    "DTZ011",  # date.today() 无 tz：同上（naive date）
    # PIE790：不必要的 pass 语句
    # 抽象方法、空实现方法、异常子类等场景显式保留 pass，更直观表达
    # "此处为空占位/待子类实现" 的意图，与 docstring 配合可读性更好。
    "PIE790",
    "S112",    # try-except-continue：与 S110 重叠的工具库资源清理/候选回退场景
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baibao"
version = "0.0.4"
description = "百宝，方便好用的 Python 常用功能库。把日常开发中反复用到的能力封装成简洁的 API，开箱即用。"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.8"
authors = [
    {name = "Kahle"}
]
dependencies = [
    "kunlun>=0.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
all = ["easyocr>=1.7.0", "paddleocr>=2.7.0", "opencv-python>=4.8.0", "numpy>=1.24.0"]
dev = ["pytest", "ruff", "mypy"]
easyocr = ["easyocr>=1.7.0", "opencv-python>=4.8.0", "numpy>=1.24.0"]
paddleocr = ["paddleocr>=2.7.0", "opencv-python>=4.8.0", "numpy>=1.24.0"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["easyocr", "paddleocr"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
ignore = [
    "S110",    # try-except-pass：资源清理场景，静默是预期行为
    "BLE001",  # 盲异常：与 S110 重叠的工具库资源清理场景
    "DTZ005",  # datetime.now() 无 tz：工具库默认使用 naive datetime
    "DTZ007",  # strptime 无 %z：同上
    # 以下规则要求改用 PEP 585/604 现代类型注解（dict[] / X | None），
    # 这在运行时需 Python 3.9+，或必须配合 `from __future__ import annotations`
    # 才能兼容 py38。本项目选择保持 typing.Dict/Optional/Union 原样风格，
    # 不做类型注解现代化转换，以贴近 typing 模块的传统写法、降低阅读门槛。
    "FA100",   # 建议加 future import 以简化 typing.Dict 等注解
    "FA102",   # 要求加 future import（PEP 585 内置泛型）
    "UP006",   # non-pep585-annotation：Dict/List/Tuple → dict/list/tuple
    "UP007",   # non-pep604-annotation-union：Union[X, Y] → X | Y
    "UP045",   # non-pep604-annotation-optional：Optional[X] → X | None
    # PIE790：不必要的 pass 语句
    # 抽象方法、空实现方法、异常子类等场景显式保留 pass，更直观表达
    # "此处为空占位/待子类实现" 的意图，与 docstring 配合可读性更好。
    "PIE790",
]

[tool.pytest.ini_options]
pythonpath = ["src"]


